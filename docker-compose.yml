version: '3.8'

services:
  # FastAPI Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: researchmind-backend
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - API_BASE_URL=http://backend:8000
      - CHROMA_DB_PATH=/app/data/chroma_db
    volumes:
      - ./data:/app/data
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - researchmind-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Streamlit Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: researchmind-frontend
    ports:
      - "8501:8501"
    environment:
      - API_BASE_URL=http://backend:8000
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_HEADLESS=true
    volumes:
      - ./frontend:/app
    depends_on:
      - backend
    networks:
      - researchmind-network
    command: streamlit run streamlit_app.py --server.port=8501

  # Optional: Qdrant Vector Database (for production)
  # qdrant:
  #   image: qdrant/qdrant:latest
  #   container_name: researchmind-qdrant
  #   ports:
  #     - "6333:6333"
  #   volumes:
  #     - ./data/qdrant_storage:/qdrant/storage
  #   networks:
  #     - researchmind-network

networks:
  researchmind-network:
    driver: bridge

volumes:
  data:
    driver: local
